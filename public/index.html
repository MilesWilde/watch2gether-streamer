<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Watch Party</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <main class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">Watch Party</p>
                <h1>Watch videos together</h1>
            </div>

            <div class="room-badge">
                <span id="connectionStatus">Connecting...</span>
                ·
                <span id="listenerCount">0</span> listeners
            </div>
        </header>

        <section id="authPanel" class="card auth-panel">
            <h2 id="authTitle">Enter password</h2>

            <form id="authForm" class="add-form">
                <label id="passwordLabel" for="passwordInput">Password</label>

                <div class="input-row">
                    <input id="passwordInput" name="passwordInput" type="password" autocomplete="current-password"
                        placeholder="Password" />
                    <button id="joinButton" type="submit">Join</button>
                </div>
            </form>
        </section>

        <section id="appPanel" class="layout hidden">
            <section class="player-panel" aria-label="Video player">
                <div id="emptyPlayer" class="player-placeholder">
                    No video selected
                </div>

                <div id="player" class="youtube-player hidden">
                    <div id="youtubePlayer"></div>
                </div>

                <div class="transport">
                    <button id="playBtn" type="button" disabled>Play</button>
                    <button id="pauseBtn" type="button" disabled>Pause</button>
                    <button id="nextBtn" type="button">Next</button>
                    <button id="clearBtn" class="danger-button" type="button">Clear</button>
                    <label class="volume-control" for="volumeInput">
                        Volume
                        <input id="volumeInput" type="range" min="0" max="100" value="80" />
                    </label>
                    <button id="fullscreenBtn" class="secondary-button" type="button">Fullscreen</button>
                </div>
            </section>

            <aside class="sidebar">
                <section class="card">
                    <h2>Request video</h2>

                    <form id="requestVideoForm" class="add-form">
                        <label for="videoUrl">YouTube URL</label>
                        <div class="input-row">
                            <input id="videoUrl" name="videoUrl" type="url"
                                placeholder="https://www.youtube.com/watch?v=..." />
                            <button type="submit">Request</button>
                        </div>
                    </form>
                </section>

                <section class="card">
                    <div class="card-header">
                        <h2>Requests</h2>
                        <span id="roleBadge" class="role-badge">viewer</span>
                    </div>

                    <ol id="requests" class="playlist">
                        <li class="empty-state">No requests yet.</li>
                    </ol>
                </section>

                <section class="card">
                    <h2>Playlist</h2>
                    <ol id="playlist" class="playlist">
                        <li class="empty-state">No videos yet.</li>
                    </ol>
                </section>
            </aside>
        </section>
    </main>

    <script src="/app.js" type="module"></script>
</body>

</html>
